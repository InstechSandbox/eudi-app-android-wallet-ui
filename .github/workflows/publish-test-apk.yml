name: Publish Test APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag and release identifier for the APK publication.
        required: true
        type: string
      release_name:
        description: Human-readable release title.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      INPUT_RELEASE_NAME: ${{ inputs.release_name }}
      INPUT_PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Check out wallet repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release_meta
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=12 HEAD)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [[ -z "$version_code" ]]; then
            echo "Unable to resolve versionCode from app/build.gradle.kts" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            release_name="${INPUT_RELEASE_NAME:-$INPUT_RELEASE_TAG}"
            prerelease="$INPUT_PRERELEASE"
          else
            release_tag="demo-main-r${GITHUB_RUN_NUMBER}-${short_sha}"
            release_name="Demo main release r${GITHUB_RUN_NUMBER} (${short_sha}, vc${version_code})"
            prerelease="false"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore Android signing keystore
        run: |
          [[ -n "$ANDROID_KEY_ALIAS" ]]
          [[ -n "$ANDROID_KEY_PASSWORD" ]]
          if [[ ${#ANDROID_KEY_PASSWORD} -lt 6 ]]; then
            echo "ANDROID_KEY_PASSWORD must be at least 6 characters for keytool/JKS generation" >&2
            exit 1
          fi
          keytool -genkeypair \
            -storetype JKS \
            -keystore sign \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=InstechSandbox Android Demo, OU=Cloud Build, O=InstechSandbox, L=Dublin, ST=Leinster, C=IE"

      - name: Build demo release APK
        run: ./gradlew -x workspaceClean :app:assembleDemoRelease --console=plain

      - name: Generate Android compliance bundle
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          bundle_dir=".local/mobile-compliance/${RELEASE_TAG}-android"
          mkdir -p "$bundle_dir"

          cp LICENSE.txt "$bundle_dir/LICENSE.txt"
          cp NOTICE.txt "$bundle_dir/NOTICE.txt"
          cp gradle/libs.versions.toml "$bundle_dir/libs.versions.toml"

          git remote get-url origin > "$bundle_dir/source-repository.txt"
          git rev-parse HEAD > "$bundle_dir/source-commit.txt"

          cat > "$bundle_dir/release-record.md" <<EOF
          # Android Release Record

          - Release tag: ${RELEASE_TAG}
          - Release name: ${RELEASE_NAME}
          - Repository: $(git remote get-url origin)
          - Commit: $(git rev-parse HEAD)
          - Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Distribution status: proof-of-concept tester $( [[ "$RELEASE_PRERELEASE" == "true" ]] && printf 'prerelease' || printf 'release' )

          ## Included notices

          - LICENSE.txt
          - NOTICE.txt
          - gradle/libs.versions.toml

          ## Notes

          This sidecar is generated directly from the Android wallet repository so the tester APK release remains self-contained even when cross-repository compliance helpers are unavailable in GitHub Actions.
          EOF

      - name: Archive compliance bundle
        run: |
          bundle_dir=".local/mobile-compliance/${{ steps.release_meta.outputs.release_tag }}-android"
          cd .local/mobile-compliance
          zip -r "${{ steps.release_meta.outputs.release_tag }}-android-compliance.zip" "${{ steps.release_meta.outputs.release_tag }}-android"
          cd - >/dev/null

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          files: |
            app/build/outputs/apk/demo/release/*.apk
            .local/mobile-compliance/${{ steps.release_meta.outputs.release_tag }}-android-compliance.zip